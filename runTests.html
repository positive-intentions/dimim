<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dimim — DimTest</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #e2e8f0;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <div id="dim-test-root" hidden></div>

    <script>
      (function () {
        var STORAGE_KEY = "dimim-impl";
        var CDN_DIM_LIB = "https://positive-intentions.github.io/dim/lib/";
        var impl = "js";
        var dimLib = CDN_DIM_LIB;
        try {
          var params = new URLSearchParams(location.search || "");
          var q = params.get("impl") || "";
          q = String(q).toLowerCase();
          if (q === "js" || q === "wasm") {
            impl = q;
            try {
              localStorage.setItem(STORAGE_KEY, impl);
            } catch (e) {}
          } else {
            var stored = (localStorage.getItem(STORAGE_KEY) || "").toLowerCase();
            if (stored === "js" || stored === "wasm") impl = stored;
          }
          var dl = params.get("dimLib") || "";
          if (dl) {
            dimLib = dl.charAt(dl.length - 1) === "/" ? dl : dl + "/";
          }
        } catch (e) {}
        document.documentElement.dataset.dimRuntime = impl;

        var VAULT_FLAG = "dimim-vault";
        var LIVE_DB = "DimDatabase";
        var testRunId =
          Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
        var testDbSeq = 0;
        var originalIdbOpen = indexedDB.open.bind(indexedDB);
        globalThis.__DIM_ORIG_IDB_OPEN__ = originalIdbOpen;
        indexedDB.open = function (name, version) {
          var next = name;
          if (name === LIVE_DB) {
            next = LIVE_DB + "_test_" + testRunId + "_" + testDbSeq;
          }
          return originalIdbOpen(next, version);
        };

        function snapshotVaultFlag() {
          try {
            return {
              has: localStorage.getItem(VAULT_FLAG) !== null,
              value: localStorage.getItem(VAULT_FLAG),
            };
          } catch (e) {
            return { has: false, value: null };
          }
        }

        function restoreVaultFlag(snap) {
          try {
            if (!snap || !snap.has) {
              localStorage.removeItem(VAULT_FLAG);
            } else {
              localStorage.setItem(VAULT_FLAG, snap.value);
            }
          } catch (e) {}
        }

        function sleep(ms) {
          return new Promise(function (resolve) {
            setTimeout(resolve, ms);
          });
        }

        function withVaultIsolation(runFn) {
          var snap = snapshotVaultFlag();
          return Promise.resolve()
            .then(function () {
              return runFn();
            })
            .then(
              function (result) {
                restoreVaultFlag(snap);
                return result;
              },
              function (err) {
                restoreVaultFlag(snap);
                throw err;
              },
            );
        }

        function installTestIsolation() {
          var origTest = DimTest.test;
          DimTest.test = function (name, fn) {
            return origTest(name, function () {
              testDbSeq += 1;
              var self = this;
              var args = arguments;
              function drain(result, isError) {
                return sleep(600)
                  .then(function () {
                    if (DimTest.clearFixture) DimTest.clearFixture();
                    return sleep(300);
                  })
                  .then(function () {
                    if (isError) throw result;
                    return result;
                  });
              }
              return Promise.resolve()
                .then(function () {
                  return fn.apply(self, args);
                })
                .then(
                  function (result) {
                    return drain(result, false);
                  },
                  function (err) {
                    return drain(err, true);
                  },
                );
            });
          };

          var origRun = DimTest.run.bind(DimTest);
          DimTest.run = function () {
            return withVaultIsolation(origRun);
          };

          var origRerun = DimTest.rerun.bind(DimTest);
          DimTest.rerun = function () {
            testRunId =
              Date.now().toString(36) +
              "_" +
              Math.random().toString(36).slice(2, 8);
            testDbSeq = 0;
            return withVaultIsolation(origRerun);
          };
        }

        var dimSrc =
          impl === "wasm"
            ? dimLib + "dim.wasm.global.js"
            : dimLib + "dim.global.js";

        var chatScripts = [
          "./chat/lib/vault.js",
          "./chat/lib/tokens.js",
          "./chat/lib/theme.js",
          "./chat/lib/mockData/mockData.js",
          "./chat/lib/pairing/pairing.js",
          "./chat/lib/messages/messages.js",
          "./chat/lib/frames/frames.js",
          "./chat/lib/peer/peer.js",
          "./chat/lib/qr-payload.js",
          "./chat/lib/qr-png.js",
          "./chat/lib/app-chrome.js",
          "./chat/lib/share-code.js",
          "./chat/lib/shell/file-transfer.js",
          "./chat/lib/shell/call-session.js",
          "./chat/lib/shell/pairing-actions.js",
          "./chat/lib/shell/frame-handler.js",
          "./chat/components/atoms/button.js",
          "./chat/components/atoms/icon.js",
          "./chat/components/atoms/icon-button.js",
          "./chat/components/atoms/chip.js",
          "./chat/components/atoms/text-field.js",
          "./chat/components/atoms/text-area.js",
          "./chat/components/atoms/avatar.js",
          "./chat/components/atoms/badge.js",
          "./chat/components/atoms/overlay.js",
          "./chat/components/atoms/empty-state.js",
          "./chat/components/atoms/divider.js",
          "./chat/components/atoms/qr-code.js",
          "./chat/components/molecules/confirm-dialog.js",
          "./chat/components/molecules/overflow-menu.js",
          "./chat/components/molecules/message-bubble.js",
          "./chat/components/molecules/composer.js",
          "./chat/components/molecules/chat-header.js",
          "./chat/components/molecules/incoming-call-banner.js",
          "./chat/components/molecules/qr-scanner.js",
          "./chat/components/molecules/share-code-panel.js",
          "./chat/components/organisms/unlock-screen.js",
          "./chat/components/organisms/call-screen.js",
          "./chat/components/organisms/pairing-wizard.js",
          "./chat/components/organisms/chat-thread.js",
          "./chat/components/templates/meet-layout.js",
          "./chat/components/organisms/chat-shell.js",
          "./chat/components/pages/meet-app/meet-app.js",
        ];

        var testScripts = [
          "./chat/lib/vault.test.js",
          "./chat/lib/tokens.test.js",
          "./chat/lib/theme.test.js",
          "./chat/lib/mockData/mockData.test.js",
          "./chat/lib/pairing/pairing.test.js",
          "./chat/lib/messages/messages.test.js",
          "./chat/lib/frames/frames.test.js",
          "./chat/lib/peer/peer.test.js",
          "./chat/lib/qr-payload.test.js",
          "./chat/lib/qr-png.test.js",
          "./chat/lib/app-chrome.test.js",
          "./chat/lib/share-code.test.js",
          "./chat/lib/shell/file-transfer.test.js",
          "./chat/lib/shell/call-session.test.js",
          "./chat/lib/shell/pairing-actions.test.js",
          "./chat/lib/shell/frame-handler.test.js",
          "./chat/components/atoms/atoms.test.js",
          "./chat/components/molecules/confirm-dialog.test.js",
          "./chat/components/molecules/overflow-menu.test.js",
          "./chat/components/molecules/message-bubble.test.js",
          "./chat/components/molecules/composer.test.js",
          "./chat/components/molecules/chat-header.test.js",
          "./chat/components/molecules/incoming-call-banner.test.js",
          "./chat/components/molecules/share-code-panel.test.js",
          "./chat/components/organisms/unlock-screen.test.js",
          "./chat/components/organisms/call-screen.test.js",
          "./chat/components/organisms/pairing-wizard.test.js",
          "./chat/components/organisms/chat-thread.test.js",
          "./chat/components/templates/meet-layout.test.js",
          "./chat/components/organisms/chat-shell.test.js",
          "./chat/components/pages/meet-app/meet-app.test.js",
          "./chat/e2e/helpers.js",
          "./chat/e2e/meet-app.e2e.test.js",
          "./chat/e2e/p2p.e2e.test.js",
        ];

        function loadScript(src) {
          return new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.src = src;
            s.async = false;
            s.onload = function () {
              resolve();
            };
            s.onerror = function () {
              reject(new Error("Failed to load " + src));
            };
            document.head.appendChild(s);
          });
        }

        function loadScriptChain(urls, index) {
          if (index >= urls.length) return Promise.resolve();
          return loadScript(urls[index]).then(function () {
            return loadScriptChain(urls, index + 1);
          });
        }

        function coverPathFromSrc(src) {
          return String(src).replace(/^\.\//, "");
        }

        function injectInstrumented(source, file) {
          return new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.text =
              source +
              "\n//# sourceURL=" +
              file.replace(/[^\w./-]/g, "_");
            try {
              document.head.appendChild(s);
              resolve();
            } catch (err) {
              reject(err);
            }
          });
        }

        function loadInstrumentedChat(index) {
          if (index >= chatScripts.length) return Promise.resolve();
          var src = chatScripts[index];
          var file = coverPathFromSrc(src);
          DimTest.splash(
            "Instrumenting " +
              (index + 1) +
              "/" +
              chatScripts.length +
              "…",
          );
          return fetch(src)
            .then(function (res) {
              if (!res.ok) {
                throw new Error(
                  "Failed to fetch " + src + " (" + res.status + ")",
                );
              }
              return res.text();
            })
            .then(function (text) {
              var instrumented = DimTest.instrument(text, file);
              return injectInstrumented(instrumented, file);
            })
            .then(function () {
              return loadInstrumentedChat(index + 1);
            });
        }

        function boot() {
          return loadScript(dimLib + "dim.test.global.js")
            .then(function () {
              if (!globalThis.DimTest) {
                throw new Error("DimTest global missing");
              }
              installTestIsolation();
              DimTest.splash("Loading Dim (" + impl + ")…");
              return loadScriptChain(
                [dimSrc, "./runtime.js", dimLib + "dim.cover.global.js"],
                0,
              );
            })
            .then(function () {
              if (!globalThis.Dim) {
                throw new Error("Dim global missing — check CDN / ?impl=");
              }
              if (!globalThis.DimTest.instrument) {
                throw new Error(
                  "DimTest.instrument missing — need dim.cover.global.js on the Dim CDN",
                );
              }
              if (!globalThis.DimParse || !globalThis.DimParse.parse) {
                throw new Error(
                  "DimParse missing — need a dim.cover.global.js that embeds DimParse (rebuild Pages lib or ?dimLib=)",
                );
              }
              if (!globalThis.BP) {
                throw new Error("BP runtime missing");
              }
              DimTest.splash("Instrumenting chat…");
              return loadInstrumentedChat(0);
            })
            .then(function () {
              DimTest.splash("Loading tests…");
              return loadScriptChain(testScripts, 0);
            })
            .then(function () {
              DimTest.splash("Running tests…");
              return DimTest.run();
            });
        }

        boot().catch(function (err) {
          if (globalThis.DimTest && DimTest.splash) {
            DimTest.splash(String(err && err.message ? err.message : err));
          }
          globalThis.__DIM_TEST__ = {
            done: true,
            passed: 0,
            failed: 1,
            results: [
              {
                name: "boot",
                ok: false,
                error: String(err && err.stack ? err.stack : err),
              },
            ],
          };
          console.error(err);
        });
      })();
    </script>
  </body>
</html>
